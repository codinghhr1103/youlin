services:
  - type: web
    name: youlin
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: ADMIN_USERNAME
        value: youlinadmin
      - key: ADMIN_EMAIL
        value: youlinadmin@youlin.local
      - key: ADMIN_PASSWORD
        value: YoulinAdmin!2026
